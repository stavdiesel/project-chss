services:
  - type: web
    name: chs-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: chs-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: CANCEL_DEADLINE_HOURS
        value: 3

databases:
  - name: chs-db
    databaseName: fitness
    user: fitness
    plan: free
